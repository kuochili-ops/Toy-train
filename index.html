<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𓃥 白六小火車</title>
    <style>
        @font-face {
            font-family: 'WangHanZongKai';
            src: url('https://cdn.jsdelivr.net/gh/kuochili-ops/chinese-fonts@master/fonts/wt004.ttf') format('truetype');
        }
        @font-face {
            font-family: 'WangHanZongHei';
            src: url('https://cdn.jsdelivr.net/gh/kuochili-ops/chinese-fonts@master/fonts/wt001.ttf') format('truetype');
        }
        @font-face {
            font-family: 'CoolZhengHei';
            src: url('https://cdn.jsdelivr.net/gh/kuochili-ops/chinese-fonts@master/fonts/wt002.ttf') format('truetype');
        }

        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #1a1c23;
            font-family: 'WangHanZongHei', Arial, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.1rem;
            pointer-events: none;
            background: rgba(0,0,0,0.85);
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 100;
            text-align: center;
        }
        #ui-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(20, 20, 20, 0.9);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            width: 280px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        #ui-header {
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            padding-bottom: 6px;
        }
        .ui-group {
            margin-top: 8px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            font-size: 0.88rem;
        }
        .ui-group label {
            flex: 1;
            padding-top: 3px;
        }
        .ui-group textarea, .ui-group select {
            width: 140px;
            padding: 4px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            font-family: inherit;
        }
        .ui-group textarea {
            height: 60px;
            resize: none;
        }
        .ui-group input[type="color"] {
            border: none;
            width: 40px;
            height: 25px;
            cursor: pointer;
            background: transparent;
        }
        #ui-body.collapsed {
            display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="loading">載入 3D 場景中...</div>
    <div id="canvas-container"></div>

    <div id="ui-panel">
        <div id="ui-header" onclick="toggleUI()">
            <span>⚙️ 𓃥 白六小火車設定</span>
            <span id="collapse-icon">▼</span>
        </div>
        <div id="ui-body" class="collapsed">
            <div class="ui-group" style="margin-top:12px;">
                <label>招牌文字<br><small style="color:#aaa;">(每行一則，動態輪播)</small>：</label>
                <textarea id="sign-text" oninput="parseSignLines()">𓃥 白六小火車&#10;歡迎乘坐台鐵&#10;下一站：阿里山&#10;祝您旅途愉快</textarea>
            </div>
            <div class="ui-group">
                <label>字型選擇：</label>
                <select id="sign-font" onchange="updateSignCanvas()">
                    <option value="WangHanZongHei" selected>王漢宗粗黑體</option>
                    <option value="WangHanZongKai">王漢宗粗楷體</option>
                    <option value="CoolZhengHei">酷正黑體</option>
                    <option value="Arial">Arial</option>
                </select>
            </div>
            <div class="ui-group">
                <label>文字尺寸：</label>
                <input type="range" id="sign-font-size" min="20" max="70" value="44" oninput="updateSignCanvas()">
            </div>
            <div class="ui-group">
                <label>文字顏色：</label>
                <input type="color" id="sign-text-color" value="#f1c40f" onchange="updateSignCanvas()">
            </div>
            <div class="ui-group">
                <label>招牌底色：</label>
                <input type="color" id="sign-bg-color" value="#111111" onchange="updateSignCanvas()">
            </div>
            <hr style="border-color:#444; margin:10px 0;">
            <div class="ui-group">
                <label>山丘季節：</label>
                <select id="mountain-season" onchange="changeMountainSeason()">
                    <option value="spring">淡綠 (春)</option>
                    <option value="summer" selected>濃綠 (夏)</option>
                    <option value="autumn">紅色 (秋)</option>
                    <option value="winter">白色 (冬)</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        const TRACK_RADIUS = 12;      
        const DISC_RADIUS = 16;       
        const ROTATION_SPEED = 0.008; 

        let scene, camera, renderer, controls;
        let discGroup, trainGroup;
        let mountainTopMaterial, ribTopMaterial;
        let signTexture, signCanvas, signCtx, signGroup;
        let rods = [];

        let textLines = [];
        let currentLineIndex = 0;
        let isTriggered = false;

        const SEASON_COLORS = {
            spring: 0x90EE90,
            summer: 0x228B22,
            autumn: 0xB22222,
            winter: 0xF0F8FF
        };

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1c23);
            scene.fog = new THREE.FogExp2(0x1a1c23, 0.01);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 18, 28);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 0, 0);
            controls.maxPolarAngle = Math.PI / 2 - 0.01;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(20, 35, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            discGroup = new THREE.Group();
            scene.add(discGroup);

            buildDiscAndTracks();
            buildNaturalMountainAndRibCanopy();
            buildSingleLargeSign();

            trainGroup = new THREE.Group();
            scene.add(trainGroup);
            trainGroup.position.set(TRACK_RADIUS, 0.18, 0);

            loadTrainModel();

            parseSignLines();

            setTimeout(() => {
                const loadingEl = document.getElementById('loading');
                if (loadingEl) loadingEl.style.display = 'none';
            }, 1000);

            if (document.fonts) {
                document.fonts.ready.then(() => updateSignCanvas());
            }

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function buildDiscAndTracks() {
            const discGeo = new THREE.CylinderGeometry(DISC_RADIUS, DISC_RADIUS, 0.4, 64);
            const discMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.8 });
            const disc = new THREE.Mesh(discGeo, discMat);
            disc.position.y = -0.2;
            disc.receiveShadow = true;
            discGroup.add(disc);

            const bedGeo = new THREE.RingGeometry(TRACK_RADIUS - 0.8, TRACK_RADIUS + 0.8, 64);
            const bedMat = new THREE.MeshStandardMaterial({ color: 0x444444, side: THREE.DoubleSide });
            const bed = new THREE.Mesh(bedGeo, bedMat);
            bed.rotation.x = -Math.PI / 2;
            bed.position.y = 0.01;
            discGroup.add(bed);

            const railGauge = 0.45;
            const railGeoOuter = new THREE.TorusGeometry(TRACK_RADIUS + railGauge, 0.035, 8, 64);
            const railGeoInner = new THREE.TorusGeometry(TRACK_RADIUS - railGauge, 0.035, 8, 64);
            const railMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8, roughness: 0.2 });

            const railOuter = new THREE.Mesh(railGeoOuter, railMat);
            const railInner = new THREE.Mesh(railGeoInner, railMat);
            railOuter.rotation.x = Math.PI / 2;
            railInner.rotation.x = Math.PI / 2;
            railOuter.position.y = 0.15;
            railInner.position.y = 0.15;
            discGroup.add(railOuter, railInner);

            const sleeperCount = 80;
            const sleeperGeo = new THREE.BoxGeometry(1.3, 0.05, 0.18);
            const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x3d2514 });
            for (let i = 0; i < sleeperCount; i++) {
                const angle = (i / sleeperCount) * Math.PI * 2;
                const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
                sleeper.position.set(Math.cos(angle) * TRACK_RADIUS, 0.05, Math.sin(angle) * TRACK_RADIUS);
                sleeper.rotation.y = -angle;
                discGroup.add(sleeper);
            }
        }

        function buildNaturalMountainAndRibCanopy() {
            const mountainGroup = new THREE.Group();

            const startAngle = Math.PI * 0.76;
            const endAngle = Math.PI * 1.24;

            const baseMat = new THREE.MeshStandardMaterial({ color: 0x5a3d28, roughness: 0.9, flatShading: true });
            mountainTopMaterial = new THREE.MeshStandardMaterial({
                color: SEASON_COLORS.summer,
                roughness: 0.85,
                flatShading: true
            });

            ribTopMaterial = new THREE.MeshStandardMaterial({
                color: SEASON_COLORS.summer,
                roughness: 0.85,
                flatShading: true
            });

            const concreteMat = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.7, side: THREE.DoubleSide });

            // 1. 中央主山丘（半徑 9.0）
            const mainMountainGeo = new THREE.CylinderGeometry(1.0, 9.0, 7.2, 32, 16);
            const mPos = mainMountainGeo.attributes.position;
            for (let i = 0; i < mPos.count; i++) {
                let vx = mPos.getX(i);
                let vy = mPos.getY(i);
                let vz = mPos.getZ(i);

                const noise = Math.sin(vx * 0.5) * Math.cos(vz * 0.5) * 0.8 + Math.sin(vx * 1.2 + vz * 0.8) * 0.3;
                mPos.setY(i, vy + noise);
            }
            mainMountainGeo.computeVertexNormals();

            const mainBase = new THREE.Mesh(mainMountainGeo, baseMat);
            mainBase.position.set(0, 3.2, 0);
            mainBase.castShadow = true;
            mountainGroup.add(mainBase);

            const mainTopGeo = new THREE.CylinderGeometry(0.7, 8.8, 7.4, 32, 16);
            const mainTop = new THREE.Mesh(mainTopGeo, mountainTopMaterial);
            mainTop.position.set(0, 3.4, 0);
            mainTop.castShadow = true;
            mountainGroup.add(mainTop);

            // 2. 減少條帶數量，避免外側過於擁擠雜亂
            const ribCount = 24; 

            for (let i = 0; i < ribCount; i++) {
                const t = i / (ribCount - 1);
                const angle = startAngle + t * (endAngle - startAngle);

                const startR = 6.3;
                const startX = Math.cos(angle) * startR;
                const startZ = Math.sin(angle) * startR;
                const startY = 2.2;

                const endR = 15.4;
                const endX = Math.cos(angle) * endR;
                const endZ = Math.sin(angle) * endR;
                const endY = 0.1;

                const midR = TRACK_RADIUS;
                const midX = Math.cos(angle) * midR;
                const midZ = Math.sin(angle) * midR;
                const midY = 4.35 + Math.sin(t * Math.PI) * 0.35;

                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(startX, startY, startZ),
                    new THREE.Vector3(midX, midY, midZ),
                    new THREE.Vector3(endX, endY, endZ)
                ]);

                const points = curve.getPoints(16);
                
                const noiseVal = Math.sin(i * 1.5) * 0.6 + Math.cos(i * 0.8) * 0.4;
                const colorSpanThreshold = 1.6 + noiseVal * 0.8;

                for (let j = 0; j < points.length - 1; j++) {
                    const p1 = points[j];
                    const p2 = points[j + 1];
                    const dist = p1.distanceTo(p2);

                    const ribGeo = new THREE.BoxGeometry(1.2, 0.3, dist * 1.05);
                    const distFromTrack = Math.abs(p1.length() - TRACK_RADIUS);
                    const isTopColored = (distFromTrack <= colorSpanThreshold);

                    const ribMat = isTopColored ? ribTopMaterial : baseMat;
                    const beam = new THREE.Mesh(ribGeo, ribMat);
                    
                    beam.position.copy(p1).add(p2).multiplyScalar(0.5);
                    beam.lookAt(p2);
                    beam.castShadow = true;
                    mountainGroup.add(beam);
                }
            }

            // 3. 水泥拱門門框與兩側內側空隙遮蔽（從水泥門側邊往中央山方向排列）
            const portalShape = new THREE.Shape();
            portalShape.moveTo(-2.5, 0);
            portalShape.lineTo(2.5, 0);
            portalShape.lineTo(2.5, 5.6);
            portalShape.lineTo(-2.5, 5.6);
            portalShape.closePath();

            const holePath = new THREE.Path();
            holePath.moveTo(-1.9, 0);
            holePath.lineTo(-1.9, 2.7);
            holePath.absarc(0, 2.7, 1.9, Math.PI, 0, true);
            holePath.lineTo(1.9, 0);
            holePath.closePath();
            portalShape.holes.push(holePath);

            [startAngle, endAngle].forEach((angle) => {
                const portalGroup = new THREE.Group();

                const portalGeo = new THREE.ExtrudeGeometry(portalShape, { 
                    depth: 0.5, 
                    bevelEnabled: true, 
                    bevelThickness: 0.05, 
                    bevelSize: 0.05, 
                    bevelSegments: 2 
                });
                const portalMesh = new THREE.Mesh(portalGeo, concreteMat);
                portalMesh.position.set(0, 0, -0.25);
                portalGroup.add(portalMesh);

                // 【內側空隙修正】：從水泥門側邊（±2.6 處）往中央山方向密集排列不同高度的遮蔽材料
                [-1, 1].forEach(sideMultiplier => {
                    const numBars = 5; // 5 根密集排列
                    for (let b = 0; b < numBars; b++) {
                        // 從門側邊往內（向中央山方向延伸）
                        const offsetX = sideMultiplier * (2.6 + b * 0.35);
                        const offsetZ = -0.4 - (b * 0.2);
                        const barHeight = 4.5 - (b * 0.6); // 越往中央山高度漸減，完美貼合山勢空隙
                        const barWidth = 0.4;

                        const sideBarGeo = new THREE.BoxGeometry(barWidth, barHeight, 0.4);
                        const sideBar = new THREE.Mesh(sideBarGeo, baseMat);

                        sideBar.position.set(offsetX, barHeight / 2, offsetZ);
                        sideBar.castShadow = true;
                        portalGroup.add(sideBar);
                    }
                });

                portalGroup.position.set(Math.cos(angle) * TRACK_RADIUS, 0.01, Math.sin(angle) * TRACK_RADIUS);
                portalGroup.rotation.y = -angle;

                mountainGroup.add(portalGroup);
            });

            discGroup.add(mountainGroup);
        }

        function buildSingleLargeSign() {
            signCanvas = document.createElement('canvas');
            signCanvas.width = 512;
            signCanvas.height = 256;
            signCtx = signCanvas.getContext('2d');

            signTexture = new THREE.CanvasTexture(signCanvas);

            signGroup = new THREE.Group();

            const boardGeo = new THREE.BoxGeometry(8, 4, 0.2);
            const boardMatFront = new THREE.MeshBasicMaterial({ map: signTexture });
            const boardMatSide = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const materials = [boardMatSide, boardMatSide, boardMatSide, boardMatSide, boardMatFront, boardMatSide];

            const board = new THREE.Mesh(boardGeo, materials);
            board.position.y = 2.2;
            board.castShadow = true;
            signGroup.add(board);

            const steelMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.3 });
            const xPositions = [-3, 0, 3];

            xPositions.forEach(x => {
                const mainPost = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 4.2, 8), steelMat);
                mainPost.position.set(x, 2.1, -0.1);
                signGroup.add(mainPost);

                const baseFrame = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 1.2), steelMat);
                baseFrame.position.set(x, 0.08, -0.6);
                signGroup.add(baseFrame);
            });

            const signRadius = TRACK_RADIUS - 2.2;
            signGroup.position.set(signRadius, 0, 0);
            signGroup.rotation.y = Math.PI / 2;

            discGroup.add(signGroup);
        }

        function parseSignLines() {
            const rawText = document.getElementById('sign-text').value;
            textLines = rawText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            if (textLines.length === 0) textLines = ["𓃥 白六小火車"];
            
            if (currentLineIndex >= textLines.length) {
                currentLineIndex = 0;
            }
            updateSignCanvas();
        }

        function updateSignCanvas() {
            if (!signCtx) return;
            const text = textLines[currentLineIndex] || "火車頭";
            const font = document.getElementById('sign-font').value;
            const fontSize = document.getElementById('sign-font-size').value;
            const textColor = document.getElementById('sign-text-color').value;
            const bgColor = document.getElementById('sign-bg-color').value;

            signCtx.fillStyle = bgColor;
            signCtx.fillRect(0, 0, 512, 256);

            signCtx.lineWidth = 12;
            signCtx.strokeStyle = textColor;
            signCtx.strokeRect(6, 6, 500, 244);

            signCtx.fillStyle = textColor;
            signCtx.font = `bold ${fontSize}px "${font}", sans-serif`;
            signCtx.textAlign = 'center';
            signCtx.textBaseline = 'middle';
            signCtx.fillText(text, 256, 128);

            if (signTexture) signTexture.needsUpdate = true;
        }

        function loadTrainModel() {
            const loader = new THREE.GLTFLoader();
            loader.load(
                'train_-_british_rail_class_08_rail_blue_livery.glb',
                (gltf) => {
                    const loadingEl = document.getElementById('loading');
                    if (loadingEl) loadingEl.style.display = 'none';
                    const trainModel = gltf.scene;

                    trainModel.scale.set(0.85, 0.85, 0.85);

                    const box = new THREE.Box3().setFromObject(trainModel);
                    const center = box.getCenter(new THREE.Vector3());
                    trainModel.position.x -= center.x;
                    trainModel.position.z -= center.z;

                    trainModel.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if (child.name.toLowerCase().includes('rod') || child.name.toLowerCase().includes('wheel')) {
                                rods.push(child);
                            }
                        }
                    });

                    trainGroup.add(trainModel);
                },
                null,
                (err) => {
                    console.log('未讀取到 GLB 模型，開啟備用火車頭');
                    buildFallbackTrainWithRods();
                }
            );
        }

        function buildFallbackTrainWithRods() {
            const bodyGeo = new THREE.BoxGeometry(1.3, 1.4, 3.2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0055a5, roughness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.95;
            body.castShadow = true;
            trainGroup.add(body);

            const cabGeo = new THREE.BoxGeometry(1.35, 0.8, 1.2);
            const cabMat = new THREE.MeshStandardMaterial({ color: 0x003366 });
            const cab = new THREE.Mesh(cabGeo, cabMat);
            cab.position.set(0, 1.5, -0.8);
            trainGroup.add(cab);

            const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.12, 20);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.5 });
            const rodMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9, roughness: 0.1 });

            for (let side of [-0.6, 0.6]) {
                const rodGeo = new THREE.BoxGeometry(0.05, 0.1, 2.0);
                const rod = new THREE.Mesh(rodGeo, rodMat);
                rod.position.set(side, 0.3, 0);
                trainGroup.add(rod);
                rods.push(rod);

                for (let z of [-0.9, 0, 0.9]) {
                    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                    wheel.rotation.z = Math.PI / 2;
                    wheel.position.set(side, 0.3, z);
                    trainGroup.add(wheel);
                }
            }
        }

        function changeMountainSeason() {
            const season = document.getElementById('mountain-season').value;
            const newColor = SEASON_COLORS[season];
            if (mountainTopMaterial) {
                mountainTopMaterial.color.setHex(newColor);
            }
            if (ribTopMaterial) {
                ribTopMaterial.color.setHex(newColor);
            }
        }

        function toggleUI() {
            const body = document.getElementById('ui-body');
            const icon = document.getElementById('collapse-icon');
            body.classList.toggle('collapsed');
            icon.innerText = body.classList.contains('collapsed') ? '▼' : '▲';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            discGroup.rotation.y -= ROTATION_SPEED;

            if (signGroup) {
                let currentAngle = (-discGroup.rotation.y) % (Math.PI * 2);
                if (currentAngle < 0) currentAngle += Math.PI * 2;

                const triggerThreshold = 0.45;
                const angleDiff = Math.abs(currentAngle - (Math.PI * 2));

                if (currentAngle < triggerThreshold || angleDiff < triggerThreshold) {
                    if (!isTriggered) {
                        isTriggered = true;
                        if (textLines.length > 0) {
                            currentLineIndex = (currentLineIndex + 1) % textLines.length;
                            updateSignCanvas();
                        }
                    }
                } else {
                    isTriggered = false;
                }
            }

            const time = Date.now() * 0.01;
            rods.forEach((rod, idx) => {
                rod.position.x = (idx % 2 === 0 ? -0.6 : 0.6) + Math.cos(time) * 0.03;
                rod.position.y = 0.3 + Math.sin(time) * 0.03;
            });

            if (trainGroup) {
                trainGroup.position.y = 0.18 + Math.sin(time * 2) * 0.008;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
